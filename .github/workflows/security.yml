name: Security Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 09:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - name: Audit the locked production graph
        run: |
          audit_dir="$(mktemp -d)"
          node -p 'JSON.stringify({...require("./package.json"), devDependencies: undefined})' > "$audit_dir/package.json"
          cp bun.lock "$audit_dir/"
          cd "$audit_dir"
          bun install --lockfile-only --ignore-scripts
          bun audit --audit-level=high
